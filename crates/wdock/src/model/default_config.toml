# wdock configuration. Restart wdock after editing.

[appearance]
# "auto" follows Windows, or "dark" / "light".
theme = "auto"
# "acrylic" (blurred, translucent) or "solid".
backdrop = "acrylic"
# Font for wdock's text: "auto" uses SF Pro when installed, otherwise
# Segoe UI Variable. Or name any installed family, e.g. "Inter" or "Segoe UI".
# Only wdock changes; Windows' own fonts are left alone.
font = "auto"

[performance]
# "software" renders on the CPU (WARP): ~10 MB, never wakes a discrete GPU.
# "gpu" uses the default graphics adapter; its driver adds 30-60 MB per process.
renderer = "software"

[topbar]
# Height in device-independent pixels (scaled by each monitor's DPI).
height = 30
# Show a top bar on "all" monitors or only the "primary" one.
monitors = "all"
# Windows date/time pictures: https://learn.microsoft.com/windows/win32/intl/day--month--year--and-era-format-pictures
date_format = "ddd d MMM"
time_format = "HH:mm"

[tray]
# Icons shown on the top bar; the rest go behind the chevron.
max_visible = 12
# Executable-name fragments that always go to the overflow, e.g. ["onedrive", "securityhealth"].
overflow = []

[dock]
# Icon sizes are device-independent pixels and scale with monitor DPI.
icon_size = 32
monitors = "primary"
# Which windows a dock shows: "all" or only those on its own monitor ("this-monitor").
windows = "all"
# "magnify" enlarges hovered icons; "glass" highlights without resizing.
hover_effect = "magnify"
# Optional maximum icon size during magnification (16-192, at most 3x icon_size).
# hover_size = 64
# Legacy factor used when hover_size is not set.
magnification = 2.0
# "smart" slides the dock away while a window overlaps it (maximized apps
# fill the screen), "on" always hides it until the pointer touches the
# bottom edge, "off" keeps it up and keeps maximized windows above it.
auto_hide = "smart"
# Executable paths, URIs, or shell:AppsFolder\<AppUserModelID>.
# Entries that cannot be resolved are skipped (see the log).
# Pinning, unpinning or reordering from the dock saves the list to
# %LOCALAPPDATA%\wdock\pinned.txt. When absent, Windows taskbar pins are
# imported once; this list is the fallback if the import fails.
pinned = [
    'shell:AppsFolder\Microsoft.Windows.Explorer',
    'shell:AppsFolder\MSEdge',
    'shell:AppsFolder\Microsoft.WindowsTerminal_8wekyb3d8bbwe!App',
    'shell:AppsFolder\windows.immersivecontrolpanel_cw5n1h2txyewy!microsoft.windows.immersivecontrolpanel',
]

# wdock has two shortcuts: Win+Alt+Space opens the launcher and
# Ctrl+Alt+Shift+Q quits wdock (explorer's taskbar returns). Everything else,
# including the overview and workspaces, is on the top bar.

[island]
# A Dynamic Island-style pill at the top centre of every monitor: now playing
# (any app that shows Windows' media controls), a Pomodoro timer and short
# notices. Hover to expand. false removes the window and the media subscription.
enabled = true
# Compact appearance: "island" or a top-edge "notch"; width is in DIPs.
style = "island"
notch_width = 200.0
# Enable optional widgets and choose their tab order.
file_shelf = true
widget_order = ["media", "files"]
# Pomodoro lengths in minutes.
pomodoro_work = 25
pomodoro_break = 5
# Briefly expand when brightness, charging, battery, network or the
# audio device change. Windows' own pop-ups are left alone.
notices = true
# Animate the equalizer next to what is playing. Windows' compositor (DWM)
# plays the animation, so wdock does no work per frame; false keeps still bars.
animate_equalizer = true
