[workspace]
resolver = "2"
members = ["crates/wdock", "crates/wdock-setup"]

[workspace.package]
edition = "2024"
version = "0.3.0"
license = "MIT"

[workspace.dependencies]
log = { version = "0.4", features = ["std"] }
windows = "0.62"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
